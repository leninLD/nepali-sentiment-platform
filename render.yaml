services:
  - type: web
    name: nepali-sentiment-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    
    # Health check configuration
    healthCheckPath: /api/v1/ready
    healthCheckInterval: 30
    healthCheckStartPeriod: 120  # 2 minutes: model loading + potential HF Hub download can take time
    healthCheckTimeout: 10
    healthCheckUnhealthyThreshold: 3
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Environment variables
    envVars:
      - key: MODEL_PATH
        value: ./model
      - key: HF_MODEL_REPO
        value: xlm-roberta-base  # IMPORTANT: Change this to your actual HF repo (e.g., "username/nepali-sentiment-3label")
      - key: MPLBACKEND
        value: Agg
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"  # Update after frontend is deployed
      - key: DATABASE_URL
        fromDatabase:
          name: nepali-sentiment-db
          property: connectionString
    
    # Postgres database
    databases:
      - name: nepali-sentiment-db
        plan: free

