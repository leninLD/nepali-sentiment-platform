services:
  - type: web
    name: nepali-sentiment-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    
    # Health check configuration
    healthCheckPath: /api/v1/ready
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Environment variables
    envVars:
      - key: MODEL_PATH
        value: ./model
      - key: HF_MODEL_REPO
        value: xlm-roberta-base
      - key: MPLBACKEND
        value: Agg
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: nepali-sentiment-db
          property: connectionString

databases:
  - name: nepali-sentiment-db
    plan: free


