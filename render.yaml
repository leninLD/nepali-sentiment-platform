services:
  - type: web
    name: nepali-sentiment-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    
    # Health check configuration
    healthCheckPath: /api/v1/ready
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Environment variables
    envVars:
      - key: MODEL_PATH
        value: ./model
      - key: HF_MODEL_REPO
        value: xlm-roberta-base
      - key: MPLBACKEND
        value: Agg
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: nepali-sentiment-frontend
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: nepali-sentiment-db
          property: connectionString
  - type: web
    name: nepali-sentiment-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nepali-sentiment-api
          property: url

databases:
  - name: nepali-sentiment-db
    plan: free
